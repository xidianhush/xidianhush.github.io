<text x="750.00" y="990.00" font-family="'Times New Roman','Microsoft YaHei',serif" font-size="17" fill="#1b1b1b" font-weight="normal" text-anchor="middle"><tspan dy="0.00" font-size="17.00" font-style="normal">规则只有一条：测哪个端口，就断开该端口外接的网络；另一端口原样保留，其中的独立源置零。</tspan></text>
<text x="750.00" y="1022.00" font-family="'Times New Roman','Microsoft YaHei',serif" font-size="15.5" fill="#556070" font-weight="normal" text-anchor="middle"><tspan dy="0.00" font-size="15.50" font-style="normal">于是 </tspan><tspan dy="0.00" font-size="15.50" font-style="italic">Z</tspan><tspan dy="3.72" font-size="9.92" font-style="italic">in</tspan><tspan dy="-3.72" font-size="15.50" font-style="normal"> 只依赖 </tspan><tspan dy="0.00" font-size="15.50" font-style="italic">Z</tspan><tspan dy="3.72" font-size="9.92" font-style="italic">L</tspan><tspan dy="-3.72" font-size="15.50" font-style="normal">、</tspan><tspan dy="0.00" font-size="15.50" font-style="italic">Z</tspan><tspan dy="3.72" font-size="9.92" font-style="italic">out</tspan><tspan dy="-3.72" font-size="15.50" font-style="normal"> 只依赖 </tspan><tspan dy="0.00" font-size="15.50" font-style="italic">Z</tspan><tspan dy="3.72" font-size="9.92" font-style="italic">S</tspan><tspan dy="-3.72" font-size="15.50" font-style="normal">；两式同构 —— 所谓不对称，只是“左端是源网络、右端是负载”造成的错觉。</tspan></text>
</svg>